services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    # Solo escucha en loopback: al exterior se sale por el proxy con TLS.
    # Sin el 127.0.0.1 Docker abre el puerto en todas las interfaces y se salta
    # el firewall del host escribiendo reglas propias en iptables.
    ports:
      - "127.0.0.1:8000:8000"
    # La imagen no trae curl; python ya esta dentro.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
